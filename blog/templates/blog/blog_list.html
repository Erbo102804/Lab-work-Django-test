<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>Блог</title></head>
<body>
  <h1>Все статьи</h1>
  {% for blog in blogs %}
    <div class="post">
      <h2><a href="{{ blog.get_absolute_url }}">{{ blog.title }}</a></h2>
      <p>{{ blog.content|truncatewords:20 }}</p>
    </div>
  {% empty %}
    <p>Статей пока нет.</p>
  {% endfor %}
</body>
</html>
